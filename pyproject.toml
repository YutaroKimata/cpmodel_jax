[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cpmodel-jax"
version = "0.5.0"
description = "Matrix-free Newton–Krylov exact-hat solver for the Caliendo–Parro trade model"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yutaro Kimata" }]
keywords = [
    "international-trade",
    "Caliendo-Parro",
    "JAX",
    "equilibrium",
    "Newton-Krylov",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["jax>=0.11.2,<0.12", "numpy>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "build>=1.6.1,<2", "twine>=7.0.0,<8", "ruff>=0.16.8,<1"]

[tool.setuptools]
py-modules = ["cpmodel_jax"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

